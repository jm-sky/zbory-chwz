name: zbory-chwz

services:
  # PostgreSQL Database
  db:
    image: postgres:17-alpine
    container_name: zbory-chwz-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-backend}
      - POSTGRES_USER=${POSTGRES_USER:-backend}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-zbory-chwz-db-secret}
    volumes:
      - zbory_chwz_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-backend}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - zbory-chwz-network
    # Expose port only for development (comment out in production)
    # ports:
    #   - "5432:5432"

  # Redis (for token blacklist and challenge storage)
  redis:
    image: redis:8-alpine
    container_name: zbory-chwz-redis
    restart: unless-stopped
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-zbory-chwz-redis-secret}
    volumes:
      - zbory_chwz_redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:-zbory-chwz-redis-secret}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -a $${REDIS_PASSWORD:-zbory-chwz-redis-secret} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - zbory-chwz-network
    # Expose port only for development (comment out in production)
    # ports:
    #   - "${REDIS_FORWARD_PORT:-6379}:6379"

  # Application
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: zbory-chwz-backend:latest
    container_name: zbory-chwz-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      # Secrets and app config live here. Do not re-list them under environment:
      # with ${VAR} — empty host interpolation would override env_file values.
      - ./backend/.env
    environment:
      # Docker-network overrides only (compose interpolation uses root .env + defaults)
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - PROJECT_NAME=${PROJECT_NAME:-zbory-chwz}
      - APP_PORT=${APP_PORT:-8000}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-backend}:${POSTGRES_PASSWORD:-zbory-chwz-db-secret}@db:5432/${POSTGRES_DB:-backend}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-zbory-chwz-redis-secret}@redis:6379/0
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"  # Only localhost access (reverse proxy required)
    volumes:
      # Mount uploads directory for persistent file storage (optional - S3 is preferred)
      - zbory_chwz_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - zbory-chwz-network

    # Resource limits (optional, adjust as needed)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2.0'
    #       memory: 1G
    #     reservations:
    #       cpus: '0.5'
    #       memory: 256M

networks:
  zbory-chwz-network:
    name: zbory-chwz-network
    external: true

volumes:
  zbory_chwz_postgres_data:
    name: zbory_chwz_postgres_data
  zbory_chwz_redis_data:
    name: zbory_chwz_redis_data
  zbory_chwz_uploads:
    name: zbory_chwz_uploads
